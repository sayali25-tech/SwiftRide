<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact - SwiftRide</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div id="loader"><div class="spinner"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="../index.html" class="logo">🚖 SwiftRide</a>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="login.html" class="btn-outline">Login</a></li>
        <li><a href="signup.html" class="btn-primary">Sign Up</a></li>
      </ul>
      <button class="hamburger" id="hamburger">&#9776;</button>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you. Send us a message below.</p>
  </div>
</section>

<section class="contact-section">
  <div class="container contact-grid">
    <div class="contact-info">
      <h3>📍 Address</h3><p>123 Ride Street, New Delhi, India</p>
      <h3>📞 Phone</h3><p>+91 98765 43210</p>
      <h3>✉️ Email</h3><p>support@swiftride.demo</p>
      <h3>🕒 Hours</h3><p>24 / 7 Support</p>
    </div>
    <form id="contactForm" class="contact-form" novalidate>
      <div class="field">
        <label>Name</label>
        <input type="text" id="cName" />
        <small class="error" data-for="cName"></small>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="cEmail" />
        <small class="error" data-for="cEmail"></small>
      </div>
      <div class="field">
        <label>Message</label>
        <textarea id="cMessage" rows="5"></textarea>
        <small class="error" data-for="cMessage"></small>
      </div>
      <button type="submit" class="btn-primary">Send Message</button>
      <p id="contactSuccess" class="success"></p>
    </form>
  </div>
</section>

<footer class="footer"><div class="container"><p>&copy; 2026 SwiftRide.</p></div></footer>

<script src="../js/main.js"></script>
<script src="../js/contact.js"></script>
</body>
</html>
