<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - SwiftRide</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div id="loader"><div class="spinner"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="../index.html" class="logo">🚖 SwiftRide</a>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" class="btn-outline">Login</a></li>
        <li><a href="signup.html" class="btn-primary active">Sign Up</a></li>
      </ul>
      <button class="hamburger" id="hamburger">&#9776;</button>
    </nav>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="muted">Join SwiftRide and start booking</p>
    <form id="signupForm" novalidate>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="sName" />
        <small class="error" data-for="sName"></small>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="sEmail" />
        <small class="error" data-for="sEmail"></small>
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" id="sPhone" />
        <small class="error" data-for="sPhone"></small>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="sPassword" />
        <small class="error" data-for="sPassword"></small>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="sConfirm" />
        <small class="error" data-for="sConfirm"></small>
      </div>
      <button class="btn-primary full" type="submit">Sign Up</button>
      <p id="signupMsg" class="success"></p>
      <p class="muted center">Already registered? <a href="login.html">Login</a></p>
    </form>
  </div>
</section>

<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
