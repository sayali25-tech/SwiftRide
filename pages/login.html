<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - SwiftRide</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div id="loader"><div class="spinner"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="../index.html" class="logo">🚖 SwiftRide</a>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" class="btn-outline active">Login</a></li>
        <li><a href="signup.html" class="btn-primary">Sign Up</a></li>
      </ul>
      <button class="hamburger" id="hamburger">&#9776;</button>
    </nav>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="muted">Login to continue booking rides</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" />
        <small class="error" data-for="loginEmail"></small>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" />
        <small class="error" data-for="loginPassword"></small>
      </div>
      <button class="btn-primary full" type="submit">Login</button>
      <p id="loginMsg" class="success"></p>
      <p class="muted center">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
  </div>
</section>

<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
